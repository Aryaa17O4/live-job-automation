name: Gmail Job Agent

on:
  schedule:
    - cron: '30 3 * * *'  # 9:00 AM IST
  workflow_dispatch:

jobs:
  gmail-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-gmail.txt

      - name: Write credential files
        env:
          GMAIL_TOKEN_1_JSON: ${{ secrets.GMAIL_TOKEN_1_JSON }}
          GMAIL_TOKEN_2_JSON: ${{ secrets.GMAIL_TOKEN_2_JSON }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GMAIL_TOKEN_1_JSON" > token_1.json
          echo "$GMAIL_TOKEN_2_JSON" > token_2.json
          echo "$GOOGLE_CREDENTIALS" > credentials.json

      - name: Run Gmail Job Agent
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GMAIL_TOKEN_1: token_1.json
          GMAIL_TOKEN_2: token_2.json
          GOOGLE_CREDS_FILE: credentials.json
        run: python agents/gmail_job_agent.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: gmail-jobs
          path: gmail_jobs.json
          if-no-files-found: ignore
